# repo is public until Github Action supports cloning private repos
# https://github.com/github/roadmap/issues/74
name: 'Apply Kustomizations'
description: 'Build and Apply Kustomizations with various optional wait'
inputs:
  namespace:
    description: 'namespace to use (can be also created and/or deleted after use)'
    required: true
  base:
    description: 'Kustomize base ready to build and apply'
    required: true
  image:
    description: 'set an image via kustomize set image, format is image=registry:tag'
    required: false
  waitForJob:
    description: 'K8s Job to wait for completion'
    required: true
  createNamespace:
    description: '[true/false] whether to create the namespace, default to false'
    required: false
    default: 'false'
  deleteNamespace:
    description: '[true/false] whether to clean the namespace if the job complete in time'
    required: false
    default: 'false'
  timeoutMinuteStartContainer:
    description: 'how long to wait for pulling image and starting container, does not apply once the container is running. Use action timeout_minute to timeout the overall Job run'
    required: false
    default: "10"
runs:
  using: "composite"
  steps:
    - name: "Check inputs"
      shell: bash
      run: |
        echo "     Check input:"
        echo "namespace: ${{ inputs.namespace }}"
        echo "base: ${{ inputs.base }}"
        echo "image: ${{ inputs.image }}"
        echo "waitForJob: ${{ inputs.waitForJob }}"
        echo "createNamespace: ${{ inputs.createNamespace }}"
        echo "deleteNamespace: ${{ inputs.deleteNamespace }}"

    - name: "Create Namespace"
      shell: bash
      run: |
        [[ "${{ inputs.createNamespace }}" != "true" ]] && exit 0
        echo "     Re-create namespace"
        kubectl delete namespace ${{ inputs.namespace }} || true
        kubectl create namespace ${{ inputs.namespace }}

    - name: "Build Kustomization"
      shell: bash
      run: |
        echo "     Kustomize build"
        $(cd ${{ inputs.base }} && kustomize edit set namespace ${{ inputs.namespace }})
        [[ "${{ inputs.image }}" != "" ]] && echo "     Set image '${{ inputs.image }}'" && $(cd ${{ inputs.base }} && kustomize edit set image ${{ inputs.image }})
        kustomize build --load_restrictor=none ${{ inputs.base }} -o manifests.yaml


    - name: "Apply Kustomization"
      shell: bash
      run: |
        echo "     Kubectl apply built manifests"
        kubectl apply -f manifests.yaml

    - name: "Handle Job"
      shell: bash
      run: |
        jobName=${{ inputs.waitForJob }}
        namespace=${{ inputs.namespace }}
        [[ "${jobName}" == "" ]] && exit 0

        timeout_minutes=${{ inputs.timeoutMinuteStartContainer }}
        timeout_seconds=$(jq -nr --arg minutes "$timeout_minutes" '
          $minutes | tonumber | if . >= 0 then . * 60 | ceil else error("Startup timeout must be non-negative") end
        ')
        startup_deadline=$(( $(date +%s) + timeout_seconds ))
        last_streamed_pod=""
        last_streamed_instance=""
        last_failed_instance=""
        last_stopped_extractor_instance=""

        # Read the template before Pods exist; never infer readiness from empty logs.
        job_json=$(kubectl -n "$namespace" get job "$jobName" -o json)
        extractor=$(jq -r '[.spec.template.spec.containers[] | select(.name | contains("extractor"))][0].name // empty' <<< "$job_json")
        main_container=$(jq -r --arg job "$jobName" '
          [.spec.template.spec.containers[] | select(.name | contains("extractor") | not)] as $main |
          ($main | map(select(.name == $job)) | .[0].name) // $main[0].name // empty
        ' <<< "$job_json")
        [[ -n "$main_container" ]] || { echo "Job has no main container"; exit 1; }

        show_terminal_logs() {
          if [[ -n "$node_name" && -n "$pod_name" && "$pod_name" != "$last_streamed_pod" ]]; then
            kubectl -n "$namespace" logs "$pod_name" -c "$main_container" || true
            last_streamed_pod="$pod_name"
          fi
        }

        stop_running_extractor() {
          if [[ -n "$extractor" && -n "$node_name" && "$pod_name:$container_instance" != "$last_stopped_extractor_instance" ]] && jq -e --arg name "$extractor" '
            any((.items[-1].status.containerStatuses // [])[]; .name == $name and .state.running != null)
          ' <<< "$pods_json" >/dev/null; then
            echo "     Stop extractor after failed main container in $pod_name"
            # The helper may exit between observation and exec. Retry API errors while
            # it still runs, within the bounded startup window; preserve the Job result.
            if kubectl exec -n "$namespace" "$pod_name" -c "$extractor" -- sh -c 'rm -rf /tmp/runfile'; then
              last_stopped_extractor_instance="$pod_name:$container_instance"
            fi
          fi
        }

        echo "     Waiting for assigned main container (startup timeout $timeout_minutes minutes)"
        while true; do
          job_json=$(kubectl -n "$namespace" get job "$jobName" -o json)
          pods_json=$(kubectl -n "$namespace" get pods -l "job-name=$jobName" --sort-by=.metadata.creationTimestamp -o json)
          pod_name=$(jq -r '.items[-1].metadata.name // empty' <<< "$pods_json")
          node_name=$(jq -r '.items[-1].spec.nodeName // empty' <<< "$pods_json")
          container_instance=$(jq -c --arg name "$main_container" '
            [(.items[-1].status.containerStatuses // [])[] | select(.name == $name)][0] |
            [.containerID, .restartCount, .state.running.startedAt]
          ' <<< "$pods_json")
          main_state=$(jq -c --arg name "$main_container" '
            [(.items[-1].status.containerStatuses // [])[] | select(.name == $name)][0].state // {}
          ' <<< "$pods_json")

          if jq -e 'any(.status.conditions[]?; .type == "Failed" and .status == "True")' <<< "$job_json" >/dev/null; then
            echo "     Job failed (including exhausted backoff)"
            show_terminal_logs
            break
          fi
          if [[ -z "$extractor" ]] && jq -e 'any(.status.conditions[]?; .type == "Complete" and .status == "True")' <<< "$job_json" >/dev/null; then
            show_terminal_logs
            echo "     Job completed successfully"
            exit 0
          fi
          if [[ -n "$node_name" ]] && jq -e '.terminated.exitCode == 0' <<< "$main_state" >/dev/null; then
            # An extractor keeps the Pod/Job running after the main container succeeds.
            # Without an extractor, wait for the Job condition (e.g. multiple completions).
            if [[ -n "$extractor" ]]; then
              show_terminal_logs
              echo "     Main container completed; extract artifacts and stop extractor"
              kubectl cp "$namespace/$pod_name:/job_outputs" ./ -c "$extractor"
              kubectl exec -n "$namespace" "$pod_name" -c "$extractor" -- sh -c 'rm -rf /tmp/runfile'
              exit 0
            fi
          fi

          if [[ -n "$node_name" ]] && jq -e '.terminated != null and .terminated.exitCode != 0' <<< "$main_state" >/dev/null; then
            # The helper can start after the main exits; stop it once it is running.
            # Otherwise it prevents the Pod failing and the Job retrying.
            stop_running_extractor
            if [[ "$pod_name:$container_instance" != "$last_failed_instance" ]]; then
              show_terminal_logs
              startup_deadline=$(( $(date +%s) + timeout_seconds ))
              last_failed_instance="$pod_name:$container_instance"
            fi
          fi

          if [[ -n "$node_name" ]] && jq -e '.running != null' <<< "$main_state" >/dev/null; then
            # The workflow's overall timeout governs execution after the container starts.
            startup_deadline=""
            if [[ "$pod_name:$container_instance" != "$last_streamed_instance" ]]; then
              echo "     Main container is running; stream logs from $pod_name"
              kubectl -n "$namespace" logs -f "$pod_name" -c "$main_container" || true
              last_streamed_pod="$pod_name"
              last_streamed_instance="$pod_name:$container_instance"
              # EOF or a temporary log error is not a terminal container/Job result.
              continue
            fi
          else
            # A retry may be Pending or have no containerStatuses yet. Give its startup
            # the same bounded window; a failed attempt alone is not backoff exhaustion.
            if [[ -z "$startup_deadline" ]]; then
              startup_deadline=$(( $(date +%s) + timeout_seconds ))
            fi
            if (( $(date +%s) >= startup_deadline )); then
              echo "     Err: Timeout waiting for assigned main container"
              kubectl -n "$namespace" describe job "$jobName" || true
              kubectl -n "$namespace" describe pod -l "job-name=$jobName" || true
              exit 1
            fi
          fi
          sleep 5
        done

        # Preserve the real Job failure; cleanup must not run against an unscheduled Pod.
        stop_running_extractor
        echo "     Namespace will not be deleted to allow debugging"
        exit 1


    - name: "Clean Namespace"
      shell: bash
      run: |
        [[ "${{ inputs.deleteNamespace }}" != "true" ]] && exit 0
        echo "     Delete namespace"
        kubectl delete namespace ${{ inputs.namespace }} || true
